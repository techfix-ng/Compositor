name: Build Compositor Windows

on:
  push:
    branches: [windows-port]
    paths: ["windows/**", ".github/workflows/windows-build.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y
      - name: Build application and installer
        shell: powershell
        run: ./windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Compositor-Windows-Development-Setup
          path: windows/artifacts/*.exe
          if-no-files-found: error
      - name: Publish development preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          installer="$(find windows/artifacts -maxdepth 1 -name '*.exe' -print -quit)"
          tag="windows-v0.2.0-dev.1"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" "$installer" --repo "${{ github.repository }}" --clobber
          else
            gh release create "$tag" "$installer" --prerelease \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "Compositor for Windows 0.2.0 Development Preview 1" \
              --notes "Development preview: PSD composite preview, PSD layer discovery, full tool-shell UI, initial editable text tool, installed-font picker, and interactive text-layer visibility. This is not a finished production release."
          fi
